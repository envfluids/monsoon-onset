# Exact versions pip adds to nvcr.io/nvidia/pytorch:25.08-py3@sha256:ace9a848c0ae on top of
# its own packages: the pip layer (sha256:9cd17fbdcfef, built 2026-05-29) of
# monsoon-aifs-ens-v2:latest (sha256:4a7532b65e90 and sha256:32d3380ae2c4, same layers),
# read from the registry on 2026-11-02, so a rebuild reproduces it.
# The Dockerfile installs this file with pip --no-deps --no-build-isolation; numpy,
# scipy, torch and every other dependency not listed here come from the pinned base
# (see base-packages.txt). Seven of these replace a base version: cffi, click, fsspec,
# grpcio, numcodecs, packaging, zarr.
#
# requirements.txt holds the direct dependencies and is the file to edit. After
# changing it, regenerate this file in the pinned base (a plain resolver doesn't know
# what the base already has), keeping only what differs from base-packages.txt:
#   docker run --rm -v "$PWD/docker/aifs-ens-v2:/w" --entrypoint bash <FROM image> -c \
#     'pip install -q --no-cache-dir -r /w/requirements.txt && pip list --format=freeze' \
#     | grep -vxFf docker/aifs-ens-v2/base-packages.txt
# then restore this header, and rebuild.

